name: BombSquad
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.48.0
options:
  bundleIdPrefix: com.universal-io
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.3"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "5.0"
targets:
  BombSquad:
    type: application
    platform: macOS
    info:
      path: BombSquad/Info.plist
      properties:
        CFBundleDisplayName: "Universal I/O"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Authoritative production gateway (Vercel project "gateway").
        BOMB_SQUAD_API_BASE_URL: "https://api.universal-io.com"
        LSApplicationCategoryType: "public.app-category.productivity"
        NSMicrophoneUsageDescription: "音声入力（ASR）で下書きを作成するためにマイクを使用します。"
        CFBundleURLTypes:
          - CFBundleURLName: com.universal-io.mac.auth
            CFBundleURLSchemes:
              - universal-io
    dependencies:
      - package: Supabase
        product: Supabase
    scheme:
      testTargets:
        - BombSquadTests
    sources:
      - BombSquad
      # Bundle the gitignored Supabase auth config. Gateway routing never reads it.
      - path: BombSquad.local.plist
        buildPhase: resources
        optional: true
    settings:
      base:
        # Production identity (Release inherits this). Debug overrides it below
        # with a distinct id/name so development builds NEVER share the
        # production app's Launch Services identity — otherwise a dev build in
        # DerivedData/tmp can win bundle-id name resolution and hide the real
        # /Applications app from Launchpad. See docs/dev-prod-app-identity.md.
        PRODUCT_BUNDLE_IDENTIFIER: com.universal-io.mac
        # The .app file name (shown in permission dialogs and the TCC lists).
        # "/" is illegal in file names, so the display name stays "Universal I/O"
        # while the bundle is "Universal IO.app". Code namespace rename is M5.
        PRODUCT_NAME: Universal IO
        # Pin the Swift module name so it does NOT follow the per-config
        # PRODUCT_NAME. Without this, the Debug name "Universal IO Dev" would
        # make the module "Universal_IO_Dev" and break `@testable import
        # Universal_IO` in the test target.
        PRODUCT_MODULE_NAME: Universal_IO
        # App icon from BombSquad/Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Microphone entitlement (audio-input). Harmless under Debug too.
        CODE_SIGN_ENTITLEMENTS: BombSquad/BombSquad.entitlements
      configs:
        # Debug: a stable certificate identity so TCC grants (screen
        # recording / accessibility / microphone) and Keychain "Always Allow"
        # survive rebuilds — ad-hoc signing gets a new CDHash every build and
        # invalidates them all. The only Apple Development cert on this
        # machine belongs to the PAID team: its CN reads "... (48P276DZDB)"
        # but that suffix is a certificate id, the real team is in OU =
        # TG68TFXG88. Pointing DEVELOPMENT_TEAM at the free team therefore
        # fails with "No signing certificate 'Mac Development' found".
        Debug:
          # Distinct dev identity: coexists with the installed production app
          # instead of colliding with it. TCC (screen recording / accessibility
          # / microphone) and Keychain "Always Allow" still persist across
          # rebuilds because the signing identity below is stable — the id split
          # only changes WHICH app the grants attach to, not their durability.
          # Grant permissions once to "Universal IO Dev" on first run.
          PRODUCT_BUNDLE_IDENTIFIER: com.universal-io.mac.dev
          PRODUCT_NAME: Universal IO Dev
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: TG68TFXG88
          ENABLE_HARDENED_RUNTIME: NO
        # Release: notarizable distribution build signed with the paid team's
        # Developer ID Application cert (TG68TFXG88). Hardened Runtime on is a
        # notarization requirement. Build via tools/release.sh; see ~/AGENTS.md
        # "Apple Developer Accounts" for the team split.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: TG68TFXG88
          ENABLE_HARDENED_RUNTIME: YES
  BombSquadTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    hostApplication: BombSquad
    sources:
      - BombSquadTests
    dependencies:
      - target: BombSquad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universal-io.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
      # TEST_HOST must match the host app's per-configuration PRODUCT_NAME:
      # "Universal IO Dev" under Debug (where tests run), "Universal IO" under
      # Release. Keep in sync with the BombSquad target's names above.
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Universal IO Dev.app/Contents/MacOS/Universal IO Dev"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Universal IO.app/Contents/MacOS/Universal IO"
