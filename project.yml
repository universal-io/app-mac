name: BombSquad
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.48.0
options:
  bundleIdPrefix: com.universal-io
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  BombSquad:
    type: application
    platform: macOS
    info:
      path: BombSquad/Info.plist
      properties:
        CFBundleDisplayName: "Universal I/O"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Authoritative production gateway (Vercel project "gateway"). Debug
        # and Release both use this unless Debug explicitly opts into local
        # mode via BOMB_SQUAD_GATEWAY_MODE=local.
        # The endpoint builder tolerates a base URL with or without "/api".
        BOMB_SQUAD_API_BASE_URL: "https://api.universal-io.com"
        LSApplicationCategoryType: "public.app-category.productivity"
        NSMicrophoneUsageDescription: "音声入力（ASR）で下書きを作成するためにマイクを使用します。"
        CFBundleURLTypes:
          - CFBundleURLName: com.universal-io.mac.auth
            CFBundleURLSchemes:
              - universal-io
    dependencies:
      - package: Supabase
        product: Supabase
    # Generate a shared scheme so `xcodebuild -scheme BombSquad` works right
    # after `xcodegen generate` (CLI builds resolve SPM packages via schemes;
    # bare -target builds fail on package module resolution).
    scheme:
      testTargets:
        - BombSquadTests
      gatherCoverageData: false
    sources:
      - BombSquad
      # Bundle the gitignored local auth config so the app reads it regardless
      # of launch working directory (Finder/Spotlight/Xcode give CWD "/"). The
      # Supabase anon key is public. A gateway value in this file is inert unless
      # Debug is explicitly launched with BOMB_SQUAD_GATEWAY_MODE=local.
      # optional: build still works for developers without the file.
      - path: BombSquad.local.plist
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universal-io.mac
        # The .app file name (shown in permission dialogs and the TCC lists).
        # "/" is illegal in file names, so the display name stays "Universal I/O"
        # while the bundle is "Universal IO.app". Code namespace rename is M5.
        PRODUCT_NAME: Universal IO
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Microphone entitlement (audio-input). Harmless under Debug too.
        CODE_SIGN_ENTITLEMENTS: BombSquad/BombSquad.entitlements
      configs:
        # Debug: a stable certificate identity so TCC grants (screen
        # recording / accessibility / microphone) and Keychain "Always Allow"
        # survive rebuilds — ad-hoc signing gets a new CDHash every build and
        # invalidates them all. The only Apple Development cert on this
        # machine belongs to the PAID team: its CN reads "... (48P276DZDB)"
        # but that suffix is a certificate id, the real team is in OU =
        # TG68TFXG88. Pointing DEVELOPMENT_TEAM at the free team therefore
        # fails with "No signing certificate 'Mac Development' found".
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: TG68TFXG88
          ENABLE_HARDENED_RUNTIME: NO
        # Release: notarizable distribution build signed with the paid team's
        # Developer ID Application cert (TG68TFXG88). Hardened Runtime on is a
        # notarization requirement. Build via tools/release.sh; see ~/AGENTS.md
        # "Apple Developer Accounts" for the team split.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: TG68TFXG88
          ENABLE_HARDENED_RUNTIME: YES
  BombSquadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BombSquadTests
    dependencies:
      - target: BombSquad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universal-io.mac.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TG68TFXG88
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Universal IO.app/Contents/MacOS/Universal IO"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  # Deliberately separate from the everyday BombSquad scheme. Selecting this
  # scheme is the explicit opt-in to local Gateway development; it never falls
  # through to production when the local server is absent or broken.
  BombSquad Local Gateway:
    build:
      targets:
        BombSquad: all
    run:
      config: Debug
      environmentVariables:
        BOMB_SQUAD_GATEWAY_MODE: local
